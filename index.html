<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    --bg:#ffffff; --panel:#f7f6f3; --border:#e8e7e4; --border2:#e0dfdb;
    --text:#37352f; --muted:#a09f9b; --muted2:#7a7974;
    --hover:#ececea; --active:#e3e2de; --card:#fbfbfa; --btnbg:#ffffff;
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
  }
  .row, .btn, .sres, .drive-item, .plinkItem, #sidebarFoot button, .tog { transition: background .12s ease; }
  a[href^="#page="] { color: var(--text); background: var(--hover); border-radius: 3px; padding: 0 3px; text-decoration: none; border-bottom: 1px dashed var(--muted); cursor: pointer; }
  #editor a[href^="http"] { color: #4a90d9; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; overflow-wrap: anywhere; }
  .style-tool-actions { display: flex; flex-direction: column; gap: 4px; padding: 6px; }
  .style-tool-actions .st-row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .st-swatch { width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--border2); cursor: pointer; padding: 0; }
  .st-clear, .st-size { border: 1px solid var(--border2); background: var(--btnbg); color: var(--text); border-radius: 4px; font-size: 12px; padding: 2px 8px; cursor: pointer; }
  .st-clear:hover, .st-size:hover { background: var(--hover); }
  #stylePanel { position: fixed; z-index: 40; background: var(--card); border: 1px solid var(--border2); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; }
  #stylePanel.open { display: flex; }
  #plinkPicker { position: fixed; z-index: 40; background: var(--card); border: 1px solid var(--border2); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 6px; width: 260px; }
  #plinkPicker input { width: 100%; padding: 6px 8px; border: 1px solid var(--border2); border-radius: 4px; font: inherit; font-size: 13px; background: var(--btnbg); color: var(--text); outline: none; margin-bottom: 4px; }
  .plinkItem { padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .plinkItem:hover, .plinkItem.sel { background: var(--hover); }
  html.side-hide #sidebar { display: none; }
  body.theme-sepia { --bg:#f7f1e5; --panel:#efe7d7; --border:#e0d6c2; --border2:#d8cdb6; --text:#41382c; --muted:#9a8f7c; --muted2:#7c7160; --hover:#e7ddc9; --active:#dfd3bb; --card:#f2ead9; --btnbg:#f7f1e5; }
  body.theme-green { --bg:#f2f7f2; --panel:#e7efe7; --border:#d5e2d5; --border2:#c9d9c9; --text:#2f3a2f; --muted:#8fa08f; --muted2:#6f826f; --hover:#dde9dd; --active:#d2e2d2; --card:#ecf3ec; --btnbg:#f2f7f2; }
  body.theme-blue { --bg:#f0f5fa; --panel:#e4edf6; --border:#d3e0ee; --border2:#c4d6e8; --text:#2c3440; --muted:#8fa1b5; --muted2:#6e8296; --hover:#dce8f3; --active:#d0e0ef; --card:#eaf1f8; --btnbg:#f0f5fa; }
  body.theme-pink { --bg:#faf2f4; --panel:#f5e8ec; --border:#ecd8de; --border2:#e3cad2; --text:#40323a; --muted:#b295a0; --muted2:#96707e; --hover:#f0dfe5; --active:#ecd5dd; --card:#f7edf0; --btnbg:#faf2f4; }
  body.theme-dark { --bg:#1e1e1c; --panel:#262624; --border:#3a3a37; --border2:#44443f; --text:#e4e2dc; --muted:#8a8983; --muted2:#a5a49d; --hover:#33332f; --active:#3d3d38; --card:#2b2b28; --btnbg:#2b2b28; }
  #app { display: flex; height: 100vh; }
  #sidebar { width: 260px; flex: none; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #sidebarHead { padding: 14px 12px 8px 16px; font-weight: 700; font-size: 14px; color: var(--muted2); display: flex; justify-content: space-between; align-items: center; }
  #themeSel { border: 1px solid var(--border2); background: var(--btnbg); color: var(--muted2); border-radius: 4px; font-size: 12px; padding: 2px 4px; outline: none; }
  #searchWrap { padding: 0 8px 6px; }
  #searchInput { width: 100%; padding: 6px 8px; border: 1px solid var(--border2); border-radius: 4px; font: inherit; font-size: 13px; background: var(--btnbg); color: var(--text); outline: none; }
  #tree { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  #tree ul { list-style: none; margin: 0; padding-left: 14px; }
  #tree > ul { padding-left: 0; }
  .row { display: flex; align-items: center; gap: 2px; padding: 3px 4px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--active); font-weight: 600; }
  .row.pending { opacity: .55; }
  .row.drop-into { background: #dbe9f8; }
  .row.drop-before { box-shadow: inset 0 2px 0 #4a90d9; }
  .row.drop-after { box-shadow: inset 0 -2px 0 #4a90d9; }
  .tog { width: 18px; flex: none; text-align: center; color: var(--muted); font-size: 11px; border-radius: 3px; }
  .tog.has:hover { background: var(--active); color: var(--muted2); }
  .label { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row button { visibility: hidden; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 14px; width: 20px; height: 20px; line-height: 20px; padding: 0; border-radius: 3px; }
  .row:hover button { visibility: visible; }
  .row button:hover { background: var(--active); color: var(--text); }
  #addRoot { margin: 8px; padding: 8px; border: none; border-radius: 4px; background: none; color: var(--muted2); font-size: 14px; text-align: left; cursor: pointer; }
  #addRoot:hover { background: var(--hover); }
  .hint { padding: 8px; color: var(--muted); font-size: 13px; }
  .backBtn { margin: 4px 0; border: none; background: none; color: var(--muted2); cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 4px; }
  .backBtn:hover { background: var(--hover); }
  .sres { padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .sres:hover { background: var(--hover); }
  .srt { font-size: 14px; }
  .srs { font-size: 12px; color: var(--muted2); overflow: hidden; max-height: 32px; }
  #main { flex: 1; overflow-y: auto; background: var(--bg); }
  #topbar { position: sticky; top: 0; z-index: 10; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 8px 20px; min-height: 40px; }
  #actions { display: flex; gap: 6px; }
  .btn { border: 1px solid var(--border2); background: var(--btnbg); border-radius: 4px; padding: 3px 10px; font-size: 12px; color: var(--muted2); cursor: pointer; }
  .btn:hover { background: var(--hover); }
  #status { font-size: 12px; color: var(--muted); }
  #status.err { color: #d33; }
  .panelWrap { max-width: 680px; margin: 0 auto; padding: 4px 24px; }
  .vcard { border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; background: var(--card); font-size: 13px; }
  .vhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: var(--muted2); }
  .vhead button { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 14px; }
  .vrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; }
  .vlabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vtime { color: var(--muted); font-size: 12px; }
  .aiRow { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .aiInput { flex: 1; min-width: 160px; padding: 6px 8px; border: 1px solid var(--border2); border-radius: 4px; font: inherit; font-size: 13px; background: var(--btnbg); color: var(--text); outline: none; }
  .aiResult { white-space: pre-wrap; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; font-size: 14px; line-height: 1.7; max-height: 40vh; overflow-y: auto; }
  .aiNote { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #page { max-width: 680px; margin: 0 auto; padding: 8px 24px 30vh; }
  body.w-wide #page, body.w-wide .panelWrap { max-width: 960px; }
  body.w-full #page, body.w-full .panelWrap { max-width: none; padding-left: 48px; padding-right: 48px; }
  .tblwrap .tc-wrap { overflow-x: auto; }
  .tblwrap .tc-cell { min-width: 80px; }
  #titleInput { width: 100%; border: none; outline: none; font: inherit; font-size: 34px; font-weight: 700; padding: 4px 0 12px; background: none; color: var(--text); }
  #titleInput::placeholder { color: var(--muted); opacity: .5; }
  #empty { display: flex; align-items: center; justify-content: center; height: 60vh; color: var(--muted); font-size: 15px; }
  .hidden { display: none !important; }
  .ce-block__content, .ce-toolbar__content { max-width: 100%; }
  .drive-card { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border2); border-radius: 6px; padding: 8px 12px; text-decoration: none; color: var(--text); font-size: 14px; background: var(--card); margin: 4px 0; }
  .drive-card:hover { background: var(--hover); }
  .drive-picker { border: 1px solid var(--border2); border-radius: 6px; padding: 10px; background: var(--card); }
  .drive-picker input { width: 100%; padding: 7px 8px; border: 1px solid var(--border2); border-radius: 4px; font: inherit; font-size: 13px; background: var(--btnbg); color: var(--text); outline: none; }
  .drive-crumb { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--muted2); margin: 8px 0 4px; }
  .drive-crumb span { cursor: pointer; padding: 2px 4px; border-radius: 3px; }
  .drive-crumb span:hover { background: var(--hover); }
  .drive-crumb b { color: var(--muted); font-weight: 400; }
  .drive-results { margin-top: 4px; font-size: 13px; color: var(--muted2); max-height: 260px; overflow-y: auto; }
  .drive-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; color: var(--text); }
  .drive-item:hover { background: var(--hover); }
  .drive-item .fold { color: var(--muted2); }
  .ytwrap { position: relative; padding-top: 56.25%; }
  .ytwrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 6px; }
  .mapwrap { position: relative; padding-top: 60%; }
  .mapwrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 6px; }
  .mapcap { font-size: 13px; color: var(--muted2); margin-top: 4px; }
  #tplBar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 12px; }
  #sidebarFoot { display: flex; flex-wrap: wrap; padding: 4px; border-top: 1px solid var(--border); }
  #sidebarFoot button { border: none; border-radius: 4px; background: none; color: var(--muted2); font-size: 13px; cursor: pointer; padding: 6px 8px; }
  #sidebarFoot button:hover { background: var(--hover); }
  #sidebarFoot .grow { flex: 1; text-align: left; font-size: 14px; }
  #sidebarFoot .brk { flex-basis: 100%; height: 0; }
  .row.folder .label { font-weight: 600; }
  #topLeft { display: flex; gap: 6px; align-items: center; }
  #topbar { border-bottom: 1px solid var(--border); }
  .vcard { border-radius: 8px; }
  @media (max-width: 768px) {
    #sidebar { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; transform: translateX(-105%); transition: transform .2s; box-shadow: 2px 0 12px rgba(0,0,0,.2); }
    html.nav-open #sidebar { transform: translateX(0); }
    #navMask { display: none; position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.3); }
    html.nav-open #navMask { display: block; }
    #page { padding: 8px 14px 30vh; }
    #titleInput { font-size: 26px; }
    .row button { visibility: visible; }
    #topbar { padding: 8px 10px; flex-wrap: wrap; gap: 4px; }
    .panelWrap { padding: 4px 10px; }
  }
  .intgGroup { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 8px; }
  .intgTitle { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .todoGroup { margin: 14px 0; }
  .todoGroup h3 { margin: 0 0 6px; font-size: 15px; }
  .todoGroup h3 a { color: var(--text); text-decoration: none; border-bottom: 1px dashed var(--muted); cursor: pointer; }
  .todoGroup h3 a:hover { color: var(--muted2); }
  .todoItem { display: flex; gap: 8px; padding: 4px 0 4px 6px; font-size: 15px; color: var(--text); align-items: baseline; }
  .todoItem::before { content: '☐'; color: var(--muted); }
  .todoHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .todoHead h2 { margin: 0; }
  .tblwrap .tc-table, .tblwrap .tc-cell { border-color: var(--border2); }
  .tblst-strong .tc-table { border-width: 2px !important; border-color: #8a8983 !important; }
  .tblst-strong .tc-cell { border-width: 2px !important; border-color: #8a8983 !important; }
  .tblst-gray .tc-table--heading .tc-row:first-child { background: #eceae3; font-weight: 600; }
  .tblst-blue .tc-table--heading .tc-row:first-child { background: #dcebfa; font-weight: 600; }
  .tblst-blue .tc-table, .tblst-blue .tc-cell { border-color: #b5d4f4 !important; }
  .tblst-green .tc-table--heading .tc-row:first-child { background: #e2efcd; font-weight: 600; }
  .tblst-green .tc-table, .tblst-green .tc-cell { border-color: #c0dd97 !important; }
  .tblst-amber .tc-table--heading .tc-row:first-child { background: #fbe8c4; font-weight: 600; }
  .tblst-amber .tc-table, .tblst-amber .tc-cell { border-color: #fac775 !important; }
  .tbl-compact .tc-cell { padding: 4px 8px; }
  body.theme-dark .tblst-gray .tc-table--heading .tc-row:first-child { background: #3a3a36; }
  body.theme-dark .tblst-blue .tc-table--heading .tc-row:first-child { background: #243a50; }
  body.theme-dark .tblst-blue .tc-table, body.theme-dark .tblst-blue .tc-cell { border-color: #3d5a78 !important; }
  body.theme-dark .tblst-green .tc-table--heading .tc-row:first-child { background: #2e4426; }
  body.theme-dark .tblst-green .tc-table, body.theme-dark .tblst-green .tc-cell { border-color: #4a6440 !important; }
  body.theme-dark .tblst-amber .tc-table--heading .tc-row:first-child { background: #4a3a1c; }
  body.theme-dark .tblst-amber .tc-table, body.theme-dark .tblst-amber .tc-cell { border-color: #6e5730 !important; }
  body.theme-dark .ce-popover__container { background: var(--card); border-color: var(--border2); }
  body.theme-dark .ce-popover-item, body.theme-dark .ce-popover-item__title, body.theme-dark .ce-popover-header__text { color: var(--text); }
  body.theme-dark .ce-popover-item__icon, body.theme-dark .ce-popover-item-html { background: var(--hover); color: var(--text); box-shadow: none; }
  body.theme-dark .ce-popover-item:hover:not(.ce-popover-item--no-hover) { background: var(--hover); }
  body.theme-dark .cdx-search-field { background: var(--hover); border-color: var(--border2); }
  body.theme-dark .cdx-search-field__input { color: var(--text); }
  body.theme-dark .ce-toolbar__plus, body.theme-dark .ce-toolbar__settings-btn { color: var(--text); }
  body.theme-dark .ce-toolbar__plus:hover, body.theme-dark .ce-toolbar__settings-btn:hover { background: var(--hover); }
  body.theme-dark .ce-inline-toolbar { background: var(--card); border-color: var(--border2); color: var(--text); }
  body.theme-dark .ce-inline-tool { color: var(--text); }
  body.theme-dark .ce-inline-tool:hover { background: var(--hover); }
  body.theme-dark .ce-block--selected .ce-block__content { background: var(--hover); }
  body.theme-dark .ce-code__textarea, body.theme-dark .cdx-input { background: var(--card); color: var(--text); border-color: var(--border2); box-shadow: none; }
  body.theme-dark .cdx-checklist__item-checkbox-check { background: var(--card); border-color: var(--border2); }
  body.theme-dark .tc-add-column, body.theme-dark .tc-add-row { background: var(--bg); }
  body.theme-dark .tc-add-column:hover, body.theme-dark .tc-add-row:hover, body.theme-dark .tc-add-row:hover:before { background: var(--hover); }
  body.theme-dark .tc-popover { background: var(--card); border-color: var(--border2); color: var(--text); }
  body.theme-dark .tc-popover__item-icon { background: var(--hover); border: none; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sidebarHead">
      <span>SkyNote</span>
      <select id="themeSel" title="佈景主題">
        <option value="">明亮</option>
        <option value="theme-sepia">米色</option>
        <option value="theme-green">淡綠</option>
        <option value="theme-blue">淡藍</option>
        <option value="theme-pink">粉色</option>
        <option value="theme-dark">深色</option>
      </select>
    </div>
    <div id="searchWrap"><input id="searchInput" placeholder="搜尋筆記,按 Enter…" autocomplete="off"></div>
    <div id="tree"></div>
    <div id="sidebarFoot">
      <button class="grow" onclick="addPage('')">＋ 新頁面</button>
      <button onclick="addFolder()" title="建立資料夾整理頁面">＋ 資料夾</button>
      <span class="brk"></span>
      <button onclick="document.getElementById('mdFile').click()" title="匯入 .md 檔或 Notion 匯出的 .zip">⇪ 匯入</button>
      <button onclick="showTodos()" title="彙整所有頁面未完成的待辦">☑ 待辦彙整</button>
      <button onclick="backupAll()" title="下載全部頁面的備份 zip">⇩ 備份</button>
      <button onclick="showTrash()" title="刪除的頁面保留 30 天">回收桶</button>
      <input type="file" id="mdFile" accept=".md,.markdown,.txt,.zip" class="hidden">
    </div>
  </aside>
  <div id="navMask" onclick="document.documentElement.classList.remove('nav-open')"></div>
  <div id="plinkPicker" class="hidden"><input placeholder="搜尋要連結的頁面…"><div id="plinkList"></div></div>
  <main id="main">
    <div id="topbar">
      <div id="topLeft">
      <button id="menuBtn" class="btn" onclick="toggleNav()" title="開關側欄" aria-label="開關側欄">☰</button>
      <div id="actions" class="hidden">
        <button class="btn" onclick="exportMd()">匯出 MD</button>
        <button class="btn" id="composeBtn" title="選取數個段落後按此,拆成新子頁,原地留下連結">拆分</button>
        <button class="btn" id="styleBtn" title="選取文字或跨段選取後,設定文字顏色/字級">🎨</button>
        <button class="btn" onclick="showVersions()">版本</button>
        <button class="btn" onclick="toggleAi()">AI</button>
        <button class="btn" onclick="toggleIntg()">整合</button>
        <button class="btn" onclick="toggleShare()">分享</button>
        <button class="btn" onclick="saveAsTemplate()" title="把目前這頁存成範本">存範本</button>
        <select id="widthSel" class="btn" title="頁面寬度">
          <option value="">窄版</option>
          <option value="w-wide">寬版</option>
          <option value="w-full">全寬</option>
        </select>
      </div>
      </div>
      <span id="status">載入中…</span>
    </div>
    <div id="versionPanel" class="panelWrap hidden"></div>
    <div id="aiPanel" class="panelWrap hidden"></div>
    <div id="intgPanel" class="panelWrap hidden"></div>
    <div id="sharePanel" class="panelWrap hidden"></div>
    <div id="todoView" class="panelWrap hidden"></div>
    <div id="page">
      <input id="titleInput" placeholder="未命名" autocomplete="off">
      <div id="tplBar" class="hidden"></div>
      <div id="editor"></div>
      <div id="empty" class="hidden">從左側選一個頁面,或按「＋ 新頁面」開始</div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@2/dist/editorjs.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/checklist@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/code@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@1"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/image@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  const run = (fn, ...args) => new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });

  const pages = new Map();
  let currentId = null;
  let editor = null;
  let dirty = false;
  let saveTimer = null;
  let loadSeq = 0;
  let dragId = null;
  let hasGeminiKey = false;
  let geminiModel = 'gemini-2.5-flash';
  let customTemplates = [];
  const expanded = new Set(JSON.parse(localStorage.getItem('gnExpanded') || '[]'));

  const $ = (id) => document.getElementById(id);
  const isTmp = (id) => String(id || '').startsWith('tmp_');

  // ---- 佈景主題與頁面寬度 ----
  function applyBodyClasses() {
    document.body.className = ($('themeSel').value + ' ' + $('widthSel').value).trim();
  }
  $('themeSel').value = localStorage.getItem('gnTheme') || '';
  $('widthSel').value = localStorage.getItem('gnWidth') || '';
  applyBodyClasses();
  $('themeSel').addEventListener('change', () => {
    localStorage.setItem('gnTheme', $('themeSel').value);
    applyBodyClasses();
  });
  $('widthSel').addEventListener('change', () => {
    localStorage.setItem('gnWidth', $('widthSel').value);

  function setStatus(text, cls) {
    const el = $('status');
    el.textContent = text;
    el.className = cls === 'err' ? 'err' : '';
  }

  function escapeHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function childrenOf(pid) {
    return Array.from(pages.values())
      .filter((p) => p.parentId === pid)
      .sort((a, b) => a.order - b.order || a.title.localeCompare(b.title));
  }

  function persistExpanded() {
    localStorage.setItem('gnExpanded', JSON.stringify(Array.from(expanded)));
  }

  function renderTree() {
    const root = $('tree');
    root.innerHTML = '';
    root.appendChild(renderLevel(''));
  }

  function renderLevel(pid) {
    const ul = document.createElement('ul');
    for (const p of childrenOf(pid)) {
      const li = document.createElement('li');
      const isFolder = p.kind === 'folder';
      const row = document.createElement('div');
      row.className = 'row' + (p.id === currentId ? ' active' : '') + (p.pending ? ' pending' : '') + (isFolder ? ' folder' : '');
      if (!p.pending) {
        row.onclick = isFolder ? () => toggleFolder(p.id) : () => openPage(p.id);
        row.draggable = true;
        row.addEventListener('dragstart', (e) => {
          dragId = p.id;
          e.dataTransfer.effectAllowed = 'move';
        });
        row.addEventListener('dragend', () => { dragId = null; clearDropMarks(); });
        row.addEventListener('dragover', (e) => {
          if (!dragId || dragId === p.id) return;
          e.preventDefault();
          clearDropMarks();
          row.classList.add('drop-' + dropZone(e, row));
        });
        row.addEventListener('dragleave', () => {
          row.classList.remove('drop-into', 'drop-before', 'drop-after');
        });
        row.addEventListener('drop', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const zone = dropZone(e, row);
          clearDropMarks();
          handleDrop(p.id, zone);
        });
      }

      const kids = childrenOf(p.id);
      const tog = document.createElement('span');
      tog.className = 'tog' + (kids.length ? ' has' : '');
      tog.textContent = kids.length ? (expanded.has(p.id) ? '▾' : '▸') : '·';
      if (kids.length) {
        tog.onclick = (e) => {
          e.stopPropagation();
          expanded.has(p.id) ? expanded.delete(p.id) : expanded.add(p.id);
          persistExpanded();
          renderTree();
        };
      }

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = (isFolder ? '📁 ' : '') + (p.title || (isFolder ? '新資料夾' : '未命名'));

      const add = document.createElement('button');
      add.textContent = '＋';
      add.title = isFolder ? '在資料夾內新增頁面' : '新增子頁面';
      add.onclick = (e) => { e.stopPropagation(); addPage(p.id); };

      const del = document.createElement('button');
      del.textContent = '✕';
      del.title = '刪除';
      del.onclick = (e) => { e.stopPropagation(); deletePage(p.id); };

      if (isFolder) {
        const ren = document.createElement('button');
        ren.textContent = '✎';
        ren.title = '重新命名資料夾';
        ren.onclick = async (e) => {
          e.stopPropagation();
          const name = prompt('資料夾名稱:', p.title || '');
          if (name === null) return;
          const t = name.trim() || '新資料夾';
          p.title = t;
          renderTree();
          try { await run('api_renamePage', p.id, t); } catch (err) { setStatus('改名失敗:' + (err.message || err), 'err'); }
        };
        row.append(tog, label, add, ren, del);
      } else {
        row.append(tog, label, add, del);
      }
      li.appendChild(row);
      if (kids.length && expanded.has(p.id)) li.appendChild(renderLevel(p.id));
      ul.appendChild(li);
    }
    return ul;
  }

  function dropZone(e, row) {
    const r = row.getBoundingClientRect();
    const y = e.clientY - r.top;
    if (y < r.height * 0.25) return 'before';
    if (y > r.height * 0.75) return 'after';
    return 'into';
  }

  function clearDropMarks() {
    document.querySelectorAll('.drop-into, .drop-before, .drop-after')
      .forEach((el) => el.classList.remove('drop-into', 'drop-before', 'drop-after'));
  }

  function handleDrop(targetId, zone) {
    const srcId = dragId;
    if (!srcId || srcId === targetId || isTmp(srcId)) return;
    if (collectDescendants(srcId).has(targetId)) { setStatus('不能移到自己的子頁面底下', 'err'); return; }
    const tgt = pages.get(targetId);
    let parentId, index;
    if (zone === 'into') {
      parentId = targetId;
      index = childrenOf(targetId).filter((p) => p.id !== srcId).length;
      expanded.add(targetId);
      persistExpanded();
    } else {
      parentId = tgt.parentId;
      const sib = childrenOf(parentId).filter((p) => p.id !== srcId);
      const i = sib.findIndex((p) => p.id === targetId);
      index = zone === 'before' ? i : i + 1;
    }
    applyMove(srcId, parentId, index);
  }

  function applyMove(srcId, parentId, index) {
    const src = pages.get(srcId);
    src.parentId = parentId;
    const seq = childrenOf(parentId).filter((p) => p.id !== srcId);
    seq.splice(index, 0, src);
    seq.forEach((p, i) => { p.order = i; });
    renderTree();
    setStatus('移動中…');
    run('api_movePage', srcId, parentId, index)
      .then(() => setStatus('已移動'))
      .catch(async (e) => {
        setStatus('移動失敗:' + (e.message || e), 'err');
        await reloadIndex();
      });
  }

  async function reloadIndex() {
    const res = await run('api_init');
    pages.clear();
    res.pages.forEach((p) => pages.set(p.id, p));
    renderTree();
  }

  const treeEl = document.getElementById('tree');
  treeEl.addEventListener('dragover', (e) => { if (dragId) e.preventDefault(); });
  treeEl.addEventListener('drop', (e) => {
    if (!dragId || isTmp(dragId)) return;
    e.preventDefault();
    clearDropMarks();
    applyMove(dragId, '', childrenOf('').filter((p) => p.id !== dragId).length);
  });

  // ---- 自訂區塊:瀏覽/搜尋自己的雲端硬碟並插入檔案 ----
  class DriveFileTool {
    static get toolbox() {
      return {
        title: 'Drive 檔案',
        icon: '<svg width="17" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l8.5 14.5h-17z"/><path d="M8 12l4 7"/></svg>'
      };
    }
    constructor({ data }) {
      this.data = data || {};
      this.wrap = null;
      this.stack = [{ id: '', name: '我的雲端硬碟' }];
    }
    render() {
      this.wrap = document.createElement('div');
      if (this.data.fileId) this.renderCard();
      else this.renderPicker();
      return this.wrap;
    }
    renderCard() {
      this.wrap.innerHTML = '';
      const a = document.createElement('a');
      a.className = 'drive-card';
      a.href = this.data.url;
      a.target = '_blank';
      a.rel = 'noopener';
      const img = document.createElement('img');
      img.src = 'https://drive-thirdparty.googleusercontent.com/32/type/' + (this.data.mimeType || '');
      img.width = 20; img.height = 20;
      img.onerror = () => img.remove();
      const span = document.createElement('span');
      span.textContent = this.data.name || 'Drive 檔案';
      a.append(img, span);
      this.wrap.appendChild(a);
    }
    pick(f) {
      this.data = { fileId: f.id, name: f.name, mimeType: f.mimeType, url: f.url };
      this.renderCard();
      markDirty();
    }
    fileItem(f, isFolder) {
      const item = document.createElement('div');
      item.className = 'drive-item';
      if (isFolder) {
        const fold = document.createElement('span');
        fold.className = 'fold';
        fold.textContent = '▸';
        item.appendChild(fold);
      } else {
        const img = document.createElement('img');
        img.src = 'https://drive-thirdparty.googleusercontent.com/32/type/' + (f.mimeType || '');
        img.width = 18; img.height = 18;
        img.onerror = () => img.remove();
        item.appendChild(img);
      }
      const span = document.createElement('span');
      span.textContent = f.name;
      item.appendChild(span);
      item.onclick = () => {
        if (isFolder) {
          this.stack.push({ id: f.id, name: f.name });
          this.renderPicker();
        } else {
          this.pick(f);
        }
      };
      return item;
    }
    renderPicker() {
      this.wrap.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'drive-picker';
      const input = document.createElement('input');
      input.placeholder = '搜尋整個雲端硬碟的檔名,按 Enter(或直接在下面瀏覽)…';
      const crumb = document.createElement('div');
      crumb.className = 'drive-crumb';
      this.stack.forEach((node, i) => {
        if (i > 0) {
          const sep = document.createElement('b');
          sep.textContent = '›';
          crumb.appendChild(sep);
        }
        const s = document.createElement('span');
        s.textContent = node.name;
        s.onclick = () => {
          this.stack = this.stack.slice(0, i + 1);
          this.renderPicker();
        };
        crumb.appendChild(s);
      });
      const list = document.createElement('div');
      list.className = 'drive-results';
      list.textContent = '載入中…';
      box.append(input, crumb, list);
      this.wrap.appendChild(box);

      input.addEventListener('keydown', async (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        e.stopPropagation();
        const q = input.value.trim();
        if (!q) return;
        list.textContent = '搜尋中…';
        try {
          const res = await run('api_searchDrive', q);
          list.innerHTML = '';
          if (!res.files.length) { list.textContent = '找不到檔案'; return; }
          for (const f of res.files) list.appendChild(this.fileItem(f, false));
        } catch (err) {
          list.textContent = '搜尋失敗:' + (err.message || err);
        }
      });

      const cur = this.stack[this.stack.length - 1];
      run('api_browseDrive', cur.id)
        .then((res) => {
          list.innerHTML = '';
          if (this.stack.length === 1) {
            list.appendChild(this.fileItem({ id: 'shared', name: '與我共用' }, true));
          }
          for (const f of res.folders) list.appendChild(this.fileItem(f, true));
          for (const f of res.files) list.appendChild(this.fileItem(f, false));
          if (!res.folders.length && !res.files.length && this.stack.length > 1) {
            list.textContent = '這個資料夾是空的';
          }
        })
        .catch((err) => { list.textContent = '載入失敗:' + (err.message || err); });
    }
    save() { return this.data; }
    validate(d) { return !!(d && d.fileId); }
  }

  const STYLE_COLORS = ['#e03131', '#e8590c', '#f08c00', '#2f9e44', '#1971c2', '#6741d9', '#37352f', '#a09f9b'];

  // 取範圍內每個文字節點的被選片段(跨行/跨段/整塊選取都逐節點處理)
  function styleablePartsIn(range) {
    const root = range.commonAncestorContainer;
    const scope = root.nodeType === 3 ? root.parentNode : root;
    const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => {
        if (!n.nodeValue || !range.intersectsNode(n)) return NodeFilter.FILTER_REJECT;
        const p = n.parentElement;
        if (!p || p.tagName === 'TEXTAREA' || p.closest('.ce-code')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const list = [];
    let n;
    while ((n = walker.nextNode())) {
      let start = 0, end = n.nodeValue.length;
      if (n === range.startContainer) start = range.startOffset;
      if (n === range.endContainer) end = range.endOffset;
      if (end > start) list.push({ node: n, start, end });
    }
    return list;
  }

  function applyStyleToRange(range, prop, value) {
    styleablePartsIn(range).forEach(({ node, start, end }) => { // 先全收集,再動 DOM
      let target = node;
      if (end < target.nodeValue.length) target.splitText(end);
      if (start > 0) target = target.splitText(start);
      const span = document.createElement('span');
      span.style[prop] = value;
      target.parentNode.insertBefore(span, target);
      span.appendChild(target);
    });
  }

  function clearStyleInRange(range) {
    const root = range.commonAncestorContainer;
    const scope = root.nodeType === 3 ? root.parentNode : root;
    Array.from(scope.querySelectorAll('span[style]'))
      .filter((s) => range.intersectsNode(s))
      .forEach((span) => {
        const parent = span.parentNode; // 只拆帶樣式的 span,保留 b/i/a 等
        while (span.firstChild) parent.insertBefore(span.firstChild, span);
        parent.removeChild(span);
      });
  }

      return this.button;
    }

    // 點 🎨 時 Editor.js 呼叫;只負責展開面板,不再快照 range(舊做法的 range 會失效)
    surround() {
      if (this.actions) this.actions.hidden = false;
    }

    renderActions() {
      this.actions = document.createElement('div');
      this.actions.className = 'style-tool-actions';
      this.actions.hidden = true;
      const crow = document.createElement('div');
      crow.className = 'st-row';
      this.colors.forEach((c) => {
        const sw = document.createElement('button');
        sw.type = 'button';
        sw.className = 'st-swatch';
        sw.style.background = c;
        sw.addEventListener('mousedown', (e) => { e.preventDefault(); this.apply('color', c); });
        crow.appendChild(sw);
      });
      const clr = document.createElement('button');
      clr.type = 'button';
      clr.className = 'st-clear';
      clr.textContent = '清除';
      clr.addEventListener('mousedown', (e) => { e.preventDefault(); this.clearStyle(); });
      crow.appendChild(clr);
      const srow = document.createElement('div');
      srow.className = 'st-row';
      this.sizes.forEach((pair) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'st-size';
        b.textContent = pair[0];
        b.addEventListener('mousedown', (e) => { e.preventDefault(); this.apply('fontSize', pair[1]); });
        srow.appendChild(b);
      });
      this.actions.append(crow, srow);
      return this.actions;
    }

    apply(prop, value) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { this.close(); return; }
      applyStyleToRange(sel.getRangeAt(0), prop, value);
      this.close();
    }

    clearStyle() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { this.close(); return; }
      clearStyleInRange(sel.getRangeAt(0));
      this.close();
    }

    close() {
      if (this.actions) this.actions.hidden = true;
      try { this.api.inlineToolbar.close(); } catch (e) { /* 忽略 */ }
      markDirty();
    }

    // Editor.js 選取變動時會頻繁呼叫;這裡什麼都別做(碰 actions 會把剛打開的面板關掉)
    checkState() { return false; }
  }

  async function mountEditor(data) {
    lastSelRange = null;
    lastNativeRange = null;
    if (editor) {
      const old = editor;
      editor = null;
      try { await old.isReady; old.destroy(); } catch (e) { /* 已銷毀就算了 */ }
    }
    editor = new EditorJS({
      holder: 'editor',
      placeholder: '開始輸入,按「/」插入區塊…',
      data: data && data.blocks ? data : { blocks: [] },
      i18n: EDITOR_I18N,
      tools: {
        header: { class: Header, inlineToolbar: true, config: { levels: [1, 2, 3], defaultLevel: 2 } },
        list: { class: List, inlineToolbar: true },
        checklist: { class: Checklist, inlineToolbar: true },
        quote: { class: Quote, inlineToolbar: true, config: { quotePlaceholder: '輸入引言', captionPlaceholder: '出處(可留空)' } },
        code: { class: CodeTool, config: { placeholder: '輸入程式碼' } },
        delimiter: Delimiter,
        table: { class: Table, inlineToolbar: true, config: { rows: 2, cols: 3 }, tunes: ['tableStyle'] },
        tableStyle: { class: TableStyleTune },
        image: {
          class: ImageTool,
          config: {
            uploader: {
              uploadByFile: (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                  const base64 = String(reader.result).split(',')[1];
                  run('api_uploadImage', file.name, file.type, base64)
                    .then((x) => resolve({ success: 1, file: { url: x.url } }))
                    .catch(reject);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
              })
            }
          }
        },
        driveFile: DriveFileTool,
        youtube: YouTubeTool,
        map: MapTool,
        style: { class: StyleTool }
      },
      onChange: markDirty
    });
    await editor.isReady;
  }

  function markDirty() {
    dirty = true;
    hideTplBar();
    setStatus('編輯中…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 2000);
  }

  async function doSave() {
    if (!dirty || !currentId || !editor) return;
    if (isTmp(currentId)) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(doSave, 800);
      return;
    }
    const id = currentId;
    const title = $('titleInput').value.trim() || '未命名';
    dirty = false;
    setStatus('儲存中…');
    try {
      const data = await editor.save();
      await run('api_savePage', id, title, JSON.stringify(data));
      const p = pages.get(id);
      if (p && p.title !== title) { p.title = title; renderTree(); }
      if (!dirty) setStatus('已儲存 ' + new Date().toLocaleTimeString('zh-TW', { hour12: false }));
    } catch (e) {
      dirty = true;
      setStatus('儲存失敗,10 秒後重試', 'err');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(doSave, 10000);
    }
  }

  async function flushSave() {
    clearTimeout(saveTimer);
    if (dirty && !isTmp(currentId)) await doSave();
  }

  function toggleFolder(id) {
    expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    persistExpanded();
    renderTree();
  }

  // 拆分筆記(Note Composer):把選取的區塊抽成新子頁,原地留連結。
  // Editor.js 的整塊選取在按鈕 mousedown(capture 階段)就被清掉,按下當下讀不到,
  // 所以在拖曳/鍵盤選取結束當下先「快照」範圍,按鈕再用快照。
  let lastSelRange = null;
  let lastNativeRange = null; // 原生文字選取快照(頂欄 🎨 跨段上色用)
  function readSelRange() {
    const blockEls = Array.from(document.querySelectorAll('#editor .ce-block'));
    if (!blockEls.length) return null;
    // 優先讀 Editor.js 跨區塊選取(整塊藍底,class ce-block--selected)
    const selEls = blockEls.filter((el) => el.classList.contains('ce-block--selected'));
    if (selEls.length) {
      const idxs = selEls.map((el) => blockEls.indexOf(el));
      return { lo: Math.min.apply(null, idxs), hi: Math.max.apply(null, idxs) };
    }
    // 退回原生文字選取(短距離拖曳、未觸發整塊高亮時)
    const sel = window.getSelection();
    if (sel && sel.rangeCount && !sel.isCollapsed) {
      const idxOf = (node) => {
        const el = node && (node.nodeType === 3 ? node.parentElement : node);
        const b = el && el.closest ? el.closest('.ce-block') : null;
        return b ? blockEls.indexOf(b) : -1;
      };
      const a = idxOf(sel.anchorNode), b = idxOf(sel.focusNode);
      if (a >= 0 && b >= 0) return { lo: Math.min(a, b), hi: Math.max(a, b) };
    }
    return null;
  }
  (function () {
    const ed = $('editor');
    if (ed) {
      const cap = () => setTimeout(() => {
        lastSelRange = readSelRange();
        const sel = window.getSelection();
        lastNativeRange = (sel && sel.rangeCount && !sel.isCollapsed
          && ed.contains(sel.getRangeAt(0).commonAncestorContainer))
          ? sel.getRangeAt(0).cloneRange() : null;
      }, 0);
      ed.addEventListener('mouseup', cap);
      ed.addEventListener('keyup', cap);
    }
    const btn = $('composeBtn');
    if (btn) btn.addEventListener('mousedown', (e) => { e.preventDefault(); composeExtract(); });
  })();

  // ---- 頂欄 🎨:跨段選取時 Editor.js 行內工具列不會出現,改走快照 + 頂欄面板 ----
  function styleTargetRange() {
    // 1) 當下仍有效的原生選取(按鈕 mousedown 有 preventDefault,單段選字通常還在)
    const sel = window.getSelection();
    if (sel && sel.rangeCount && !sel.isCollapsed
      && $('editor').contains(sel.getRangeAt(0).commonAncestorContainer)) return sel.getRangeAt(0);
    // 2) 原生選取快照(跨段拖選在按下按鈕時已被清掉,靠 mouseup 當下的複本)
    if (lastNativeRange && !lastNativeRange.collapsed
      && lastNativeRange.startContainer.isConnected && lastNativeRange.endContainer.isConnected) return lastNativeRange;
    // 3) 整塊藍底選取的快照(lo..hi 區塊索引)→ 造一個涵蓋整段的範圍
    const r = lastSelRange;
    const blockEls = Array.from(document.querySelectorAll('#editor .ce-block'));
    if (r && r.lo >= 0 && r.hi >= r.lo && r.hi < blockEls.length) {
      const range = document.createRange();
      range.setStart(blockEls[r.lo], 0);
      range.setEnd(blockEls[r.hi], blockEls[r.hi].childNodes.length);
      return range;
    }
    return null;
  }

  (function () {
    const sBtn = $('styleBtn');
    if (!sBtn) return;
    const panel = document.createElement('div');
    panel.id = 'stylePanel';
    panel.className = 'style-tool-actions';
    const hide = () => panel.classList.remove('open');
    const act = (fn) => (e) => {
      e.preventDefault();
      const range = styleTargetRange();
      if (!range) { setStatus('請先選取文字或段落', 'err'); hide(); return; }
      fn(range);
      hide();
      markDirty();
    };
    const crow = document.createElement('div');
    crow.className = 'st-row';
    STYLE_COLORS.forEach((c) => {
      const sw = document.createElement('button');
      sw.type = 'button';
      sw.className = 'st-swatch';
      sw.style.background = c;
      sw.addEventListener('mousedown', act((range) => applyStyleToRange(range, 'color', c)));
      crow.appendChild(sw);
    });
    const clr = document.createElement('button');
    clr.type = 'button';
    clr.className = 'st-clear';
    clr.textContent = '清除';
    clr.addEventListener('mousedown', act(clearStyleInRange));
    crow.appendChild(clr);
    const srow = document.createElement('div');
    srow.className = 'st-row';
    STYLE_SIZES.forEach((pair) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'st-size';
      b.textContent = pair[0];
      b.addEventListener('mousedown', act((range) => applyStyleToRange(range, 'fontSize', pair[1])));
      srow.appendChild(b);
    });
    panel.append(crow, srow);
    document.body.appendChild(panel);
    sBtn.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (panel.classList.contains('open')) { hide(); return; }
      const rect = sBtn.getBoundingClientRect();
      panel.style.top = (rect.bottom + 6) + 'px';
      panel.style.left = 'auto';
      panel.style.right = Math.max(8, window.innerWidth - rect.right) + 'px';
      panel.classList.add('open');
    });
    document.addEventListener('mousedown', (e) => {
      if (!panel.classList.contains('open')) return;
      if (e.target === sBtn || sBtn.contains(e.target) || panel.contains(e.target)) return;
      hide();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });
  })();

  async function composeExtract() {
    if (!currentId || !editor || isTmp(currentId)) { setStatus('請先開啟一個頁面'); return; }
    const r = readSelRange() || lastSelRange;
    if (!r || r.lo < 0 || r.hi < 0) { setStatus('請先選取要拆出的段落', 'err'); return; }
    const blockEls = Array.from(document.querySelectorAll('#editor .ce-block'));
    const lo = r.lo, hi = Math.min(r.hi, blockEls.length - 1);
    if (lo > hi || lo >= blockEls.length) { setStatus('選取已失效,請重新選取', 'err'); return; }
    let title = (blockEls[lo].textContent || '').replace(/\s+/g, ' ').trim().slice(0, 60) || '未命名';
    const pid = currentId;
    setStatus('拆分中…');
    try {
      const data = await editor.save();
      const picked = data.blocks.slice(lo, hi + 1);
      if (!picked.length) { setStatus('沒有可拆出的區塊', 'err'); return; }
      const newPage = await run('api_createPageWithContent', pid, title,
        JSON.stringify({ time: Date.now(), blocks: picked }));
      lastSelRange = null;
      if (currentId !== pid || !editor) { setStatus('頁面已切換,已建立新頁但未改動原頁', 'err'); pages.set(newPage.id, newPage); renderTree(); return; }
      const linkHtml = '<a href="#page=' + newPage.id + '">' + escapeHtml(title) + '</a>';
      editor.blocks.insert('paragraph', { text: linkHtml }, {}, hi + 1, false);
      for (let i = hi; i >= lo; i--) editor.blocks.delete(i);
      pages.set(newPage.id, newPage);
      expanded.add(pid); persistExpanded();
      renderTree();
      markDirty();
      await flushSave();
      setStatus('已拆分成新頁「' + title + '」');
    } catch (e) {
      setStatus('拆分失敗:' + (e.message || e), 'err');
    }
  }

  async function addFolder() {
    setStatus('建立資料夾…');
    try {
      const p = await run('api_createPage', '', 'folder');
      pages.set(p.id, p);
      renderTree();
      setStatus('已建立資料夾');
      const name = prompt('資料夾名稱:', '新資料夾');
      if (name !== null && name.trim() && name.trim() !== p.title) {
        p.title = name.trim();
        renderTree();
        await run('api_renamePage', p.id, p.title);
      }
    } catch (e) {
      setStatus('建立失敗:' + (e.message || e), 'err');
    }
  }

  async function openPage(id) {
    if (id === currentId) return;
    const pg = pages.get(id);
    if (pg && pg.kind === 'folder') { toggleFolder(id); return; }
    if (isTmp(currentId) && pages.has(currentId)) { setStatus('頁面建立中,請稍候…'); return; }
    document.documentElement.classList.remove('nav-open');
    await flushSave();
    hideVersions();
    hideAi();
    hideIntg();
    hideShare();
    hideTodos();
    $('page').classList.remove('hidden');
    currentId = id;
    localStorage.setItem('gnLastPage', id);
    renderTree();
    const seq = ++loadSeq;
    setStatus('載入中…');
    $('empty').classList.add('hidden');
    $('titleInput').classList.remove('hidden');
    $('actions').classList.remove('hidden');
    try {
      const res = await run('api_loadPage', id);
      if (seq !== loadSeq) return;
      $('titleInput').value = res.title === '未命名' ? '' : res.title;
      const data = JSON.parse(res.content || '{}');
      await mountEditor(data);
      if (data.blocks && data.blocks.length) hideTplBar(); else showTplBar();
      if (seq === loadSeq) setStatus('已載入');
    } catch (e) {
      if (seq === loadSeq) setStatus('載入失敗:' + (e.message || e), 'err');
    }
  }

  function showEmpty() {
    currentId = null;
    if (editor) { try { editor.destroy(); } catch (e) {} editor = null; }
    hideVersions();
    hideAi();
    hideIntg();
    hideShare();
    hideTodos();
    $('page').classList.remove('hidden');
    hideTplBar();
    $('titleInput').classList.add('hidden');
    $('actions').classList.add('hidden');
    $('empty').classList.remove('hidden');
    setStatus('');
  }

  // 樂觀建頁:先開空白編輯器,伺服器回覆後再換成真正的 id
  async function addPage(parentId) {
    if (isTmp(currentId) && pages.has(currentId)) { setStatus('頁面建立中,請稍候…'); return; }
    await flushSave();
    hideVersions();
    hideAi();
    hideIntg();
    hideShare();
    hideTodos();
    $('page').classList.remove('hidden');
    const tempId = 'tmp_' + Date.now();
    pages.set(tempId, { id: tempId, title: '', parentId: parentId || '', order: 9e15, updatedAt: '', pending: true });
    if (parentId) { expanded.add(parentId); persistExpanded(); }
    currentId = tempId;
    loadSeq++;
    renderTree();
    $('empty').classList.add('hidden');
    $('titleInput').classList.remove('hidden');
    $('actions').classList.remove('hidden');
    $('titleInput').value = '';
    await mountEditor({ blocks: [] });
    $('titleInput').focus();
    showTplBar();
    setStatus('建立頁面中…');
    try {
      const real = await run('api_createPage', parentId);
      const temp = pages.get(tempId);
      pages.delete(tempId);
      real.title = (temp && temp.title) || real.title;
      pages.set(real.id, real);
      if (currentId === tempId) {
        currentId = real.id;
        localStorage.setItem('gnLastPage', real.id);
      }
      renderTree();
      setStatus('已建立');
      if (dirty) {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(doSave, 300);
      }
    } catch (e) {
      pages.delete(tempId);
      if (currentId === tempId) showEmpty();
      renderTree();
      setStatus('建立失敗:' + (e.message || e), 'err');
    }
  }

  function collectDescendants(id) {
    const doomed = new Set([id]);
    let grew = true;
    while (grew) {
      grew = false;
      for (const p of pages.values()) {
        if (!doomed.has(p.id) && doomed.has(p.parentId)) { doomed.add(p.id); grew = true; }
      }
    }
    return doomed;
  }

  async function deletePage(id) {
    const doomed = collectDescendants(id);
    const title = (pages.get(id) || {}).title || '未命名';
    const msg = (doomed.size > 1
      ? '刪除「' + title + '」及其 ' + (doomed.size - 1) + ' 個子頁面?'
      : '刪除「' + title + '」?') + '\n(會移到回收桶,30 天內可從左下還原)';
    if (!confirm(msg)) return;
    doomed.forEach((d) => pages.delete(d));
    if (doomed.has(currentId)) showEmpty();
    renderTree();
    if (isTmp(id)) return;
    try {
      await run('api_deletePage', id);
      setStatus('已刪除');
    } catch (e) {
      setStatus('刪除失敗,請重新整理後再試', 'err');
    }
  }

  // ---- 全文搜尋 ----
  $('searchInput').addEventListener('keydown', async (e) => {
    if (e.key === 'Escape') { exitSearch(); return; }
    if (e.key !== 'Enter') return;
    const q = e.target.value.trim();
    if (!q) { exitSearch(); return; }
    const tree = $('tree');
    tree.innerHTML = '<div class="hint">搜尋中…</div>';
    try {
      const res = await run('api_search', q);
      tree.innerHTML = '';
      const back = document.createElement('button');
      back.className = 'backBtn';
      back.textContent = '← 回頁面列表';
      back.onclick = exitSearch;
      tree.appendChild(back);
      if (!res.results.length) {
        const h = document.createElement('div');
        h.className = 'hint';
        h.textContent = '沒有符合的頁面';
        tree.appendChild(h);
      }
      for (const r of res.results) {
        const item = document.createElement('div');
        item.className = 'sres';
        const t = document.createElement('div');
        t.className = 'srt';
        t.textContent = r.title || '未命名';
        item.appendChild(t);
        if (r.snippet) {
          const s = document.createElement('div');
          s.className = 'srs';
          s.textContent = '…' + r.snippet + '…';
          item.appendChild(s);
        }
        item.onclick = () => { exitSearch(); openPage(r.id); };
        tree.appendChild(item);
      }
    } catch (err) {
      tree.innerHTML = '<div class="hint">搜尋失敗:' + escapeHtml(err.message || err) + '</div>';
    }
  });

  function exitSearch() {
    $('searchInput').value = '';
    renderTree();
  }

  // ---- Markdown 匯出 ----
  function mdInline(html) {
    let s = String(html || '');
    s = s.replace(/<br\s*\/?>/gi, '\n');
    s = s.replace(/<(b|strong)>([\s\S]*?)<\/\1>/gi, '**$2**');
    s = s.replace(/<(i|em)>([\s\S]*?)<\/\1>/gi, '*$2*');
    s = s.replace(/<code[^>]*>([\s\S]*?)<\/code>/gi, '`$1`');
    s = s.replace(/<a[^>]*href="#page=[^"]*"[^>]*>([\s\S]*?)<\/a>/gi, '$1');
    s = s.replace(/<a[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi, '[$2]($1)');
    s = s.replace(/<[^>]+>/g, '');
    s = s.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
    return s;
  }

  // 區塊 HTML → 純文字(送 Google Tasks 等外部純文字服務用):
  // 去標籤 + 還原 &nbsp;/&amp; 等 HTML 實體,並把連續空白收成一個
  function htmlToPlain(html) {
    const d = document.createElement('div');
    d.innerHTML = String(html || '').replace(/<br\s*\/?>/gi, ' ');
    return (d.textContent || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  }

  function toMarkdown(title, data) {
    const lines = ['# ' + title, ''];
    for (const b of (data.blocks || [])) {
      const d = b.data || {};
      switch (b.type) {
        case 'header':
          lines.push('#'.repeat(d.level || 2) + ' ' + mdInline(d.text), '');
          break;
        case 'paragraph':
          lines.push(mdInline(d.text), '');
          break;
        case 'list':
          (d.items || []).forEach((it, i) => {
            const t = typeof it === 'string' ? it : String((it && (it.content || it.text)) || '');
            lines.push(d.style === 'ordered' ? (i + 1) + '. ' + mdInline(t) : '- ' + mdInline(t));
          });
          lines.push('');
          break;
        case 'checklist':
          (d.items || []).forEach((it) => lines.push('- [' + (it.checked ? 'x' : ' ') + '] ' + mdInline(it.text)));
          lines.push('');
          break;
        case 'quote':
          lines.push('> ' + mdInline(d.text));
          if (d.caption) lines.push('> — ' + mdInline(d.caption));
          lines.push('');
          break;
        case 'code':
          lines.push('```', d.code || '', '```', '');
          break;
        case 'delimiter':
          lines.push('---', '');
          break;
        case 'table': {
          const rows = (d.content || []).map((r) => '| ' + r.map((c) => mdInline(c)).join(' | ') + ' |');
          if (rows.length) {
            const width = (d.content[0] || []).length;
            const sep = '| ' + Array(width).fill('---').join(' | ') + ' |';
            if (d.withHeadings) lines.push(rows[0], sep, ...rows.slice(1));
            else lines.push('| ' + Array(width).fill(' ').join(' | ') + ' |', sep, ...rows);
            lines.push('');
          }
          break;
        }
        case 'image':
          lines.push('![' + mdInline(d.caption || '') + '](' + ((d.file && d.file.url) || '') + ')', '');
          break;
        case 'driveFile':
          lines.push('[' + (d.name || 'Drive 檔案') + '](' + (d.url || '') + ')', '');
          break;
        case 'youtube':
          lines.push(d.url || ('https://youtu.be/' + (d.videoId || '')), '');
          break;
      }
    }
    return lines.join('\n');
  }

  // 課表/行事曆 OCR:上傳圖片 → Gemini 抽成二維表 → 插入表格區塊到頁尾
  function aiImportSchedule() {
    if (!hasGeminiKey) { showAiKeySetup(); return; }
    if (!editor || !currentId || isTmp(currentId)) { setStatus('請先開啟一個頁面再匯入', 'err'); return; }
    const picker = document.createElement('input');
    picker.type = 'file';
    picker.accept = 'image/*';
    picker.style.display = 'none';
    document.body.appendChild(picker);
    picker.addEventListener('change', () => {
      const file = picker.files && picker.files[0];
      picker.remove();
      if (!file) return;
      const result = $('aiResult');
      if (result) { result.classList.remove('hidden'); result.textContent = '辨識中…(把圖片傳給 Gemini,忙線時會自動重試)'; }
      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = String(reader.result).split(',')[1] || '';
        const prompt = '這是一張課表或行事曆的圖片。請辨識其中的表格資料,只輸出一個 JSON 二維陣列(rows),第一列為表頭。\n'
          + '規則:\n'
          + '1. 台灣紙本課表常是直書、星期由右至左排(表頭寫成「五 四 三 二 一」)。請一律轉成由左至右閱讀:'
          + '第一欄放時間或節次,接著依序是星期一、星期二、星期三、星期四、星期五。\n'
          + '2. 只取表格本體。忽略表格外的裝飾文字(學校名稱、直書大標、教師姓名、上午/下午分隔、頁尾的授課班級說明),'
          + '不要為這些另外開一欄。\n'
          + '3. 不要新增原圖沒有的欄位;每一列的欄數都要跟表頭一致。\n'
          + '4. 橫跨整列的項目(例如「午間靜息」「整潔活動」),請在每個星期欄都填入相同文字。\n'
          + '5. 每格都用字串;沒有內容的格子用空字串。\n'
          + '只輸出純 JSON,不要任何說明文字或 markdown 圍籬。如果圖片裡看不出課表或行事曆,回傳 []。';
        try {
          const res = await run('api_geminiVision', base64, file.type || 'image/png', prompt);
          const rows = parseGridJson(res.text);
          if (!rows || !rows.length) {
            if (result) result.textContent = '這張圖看不出課表/行事曆,或辨識為空。請換一張更清楚、表格完整的圖再試。';
            return;
          }
          const cols = Math.max.apply(null, rows.map((r) => r.length));
          let norm = rows.map((r) => {
            const row = (r || []).map((c) => String(c == null ? '' : c));
            while (row.length < cols) row.push('');
            return row;
          });
          // 砍掉整欄皆空的欄位(辨識時偶爾會把表格外的直書標題誤判成一欄)
          const keep = [];
          for (let c = 0; c < cols; c++) {
            if (norm.some((row) => row[c].trim() !== '')) keep.push(c);
          }
          if (keep.length && keep.length < cols) norm = norm.map((row) => keep.map((c) => row[c]));
          const label = '課表匯入 ' + new Date().toLocaleDateString('zh-TW');
          editor.blocks.insert('header', { text: label, level: 2 }, {}, editor.blocks.getBlocksCount(), false);
          editor.blocks.insert('table', { withHeadings: true, content: norm }, {}, editor.blocks.getBlocksCount(), false);
          markDirty();
          if (result) result.textContent = '已插入課表('+ norm.length + ' 列 × ' + norm[0].length + ' 欄)到頁尾,可再手動微調。';
          setStatus('已從圖片匯入課表');
        } catch (e) {
          if (result) result.textContent = '匯入失敗:' + (e.message || e);
          setStatus('課表匯入失敗:' + (e.message || e), 'err');
        }
      };
      reader.onerror = () => { if (result) result.textContent = '讀取圖片失敗,請換一張再試。'; };
      reader.readAsDataURL(file);
    });
    picker.click();
  }

  // 從 Gemini 回覆中取出 JSON 二維陣列(容錯:去除 ```json 圍籬、擷取最外層 [ ])
  function parseGridJson(text) {
    let s = String(text || '').trim();
    s = s.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
    const a = s.indexOf('['), b = s.lastIndexOf(']');
    if (a >= 0 && b > a) s = s.slice(a, b + 1);
    try {
      const arr = JSON.parse(s);
      if (Array.isArray(arr) && arr.every((r) => Array.isArray(r))) return arr;
    } catch (e) { /* 解析失敗回 null */ }
    return null;
  }

  // ---- Markdown 匯入 ----
  function inlineMd(s) {
    return escapeHtml(s)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
      .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>')
      .replace(/\[([^\]]*)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>');
  }

  function mdToBlocks(text) {
    const lines = String(text).replace(/\r\n/g, '\n').split('\n');
    const blocks = [];
    let i = 0;
    while (i < lines.length) {
      const t = lines[i].trim();
      if (!t) { i++; continue; }
      if (/^<\/?[a-zA-Z][^>]*>$/.test(t)) { i++; continue; }
      if (t.startsWith('```')) {
        const buf = [];
        i++;
        while (i < lines.length && !lines[i].trim().startsWith('```')) { buf.push(lines[i]); i++; }
        i++;
        blocks.push({ type: 'code', data: { code: buf.join('\n') } });
        continue;
      }
      const h = t.match(/^(#{1,6})\s+(.*)/);
      if (h) { blocks.push({ type: 'header', data: { text: inlineMd(h[2]), level: Math.min(h[1].length, 3) } }); i++; continue; }
      if (/^(-{3,}|\*{3,})$/.test(t)) { blocks.push({ type: 'delimiter', data: {} }); i++; continue; }
      const img = t.match(/^!\[([^\]]*)\]\(([^)\s]+)\)/);
      if (img) { blocks.push({ type: 'image', data: { file: { url: img[2] }, caption: img[1] || '', withBorder: false, stretched: false, withBackground: false } }); i++; continue; }
      if (/^\|.*\|$/.test(t)) {
        const rows = [];
        while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) { rows.push(lines[i].trim()); i++; }
        const hasSep = rows.length > 1 && /^\|[\s:|-]+\|$/.test(rows[1]);
        const cells = rows
          .filter((r) => !/^\|[\s:|-]+\|$/.test(r))
          .map((r) => r.slice(1, -1).split('|').map((c) => inlineMd(c.trim())));
        if (cells.length) blocks.push({ type: 'table', data: { withHeadings: hasSep, content: cells } });
        continue;
      }
      if (/^[-*]\s+\[( |x|X)\]\s+/.test(t)) {
        const items = [];
        while (i < lines.length) {
          const m = lines[i].trim().match(/^[-*]\s+\[( |x|X)\]\s+(.*)/);
          if (!m) break;
          items.push({ text: inlineMd(m[2]), checked: m[1].toLowerCase() === 'x' });
          i++;
        }
        blocks.push({ type: 'checklist', data: { items: items } });
        continue;
      }
      if (/^[-*]\s+/.test(t)) {
        const items = [];
        while (i < lines.length && /^[-*]\s+/.test(lines[i].trim()) && !/^[-*]\s+\[/.test(lines[i].trim())) {
          items.push(inlineMd(lines[i].trim().replace(/^[-*]\s+/, '')));
          i++;
        }
        blocks.push({ type: 'list', data: { style: 'unordered', items: items } });
        continue;
      }
      if (/^\d+\.\s+/.test(t)) {
        const items = [];
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) {
          items.push(inlineMd(lines[i].trim().replace(/^\d+\.\s+/, '')));
          i++;
        }
        blocks.push({ type: 'list', data: { style: 'ordered', items: items } });
        continue;
      }
      if (t.startsWith('>')) {
        const buf = [];
        while (i < lines.length && lines[i].trim().startsWith('>')) {
          buf.push(lines[i].trim().replace(/^>\s?/, ''));
          i++;
        }
        blocks.push({ type: 'quote', data: { text: inlineMd(buf.join('\n')).replace(/\n/g, '<br>'), caption: '', alignment: 'left' } });
        continue;
      }
      const yt = YouTubeTool.extractId(t);
      if (/^https?:\/\/\S+$/.test(t) && yt) { blocks.push({ type: 'youtube', data: { url: t, videoId: yt } }); i++; continue; }
      blocks.push({ type: 'paragraph', data: { text: inlineMd(t) } });
      i++;
    }
    return blocks;
  }

  const cleanNotionName = (s) => String(s).replace(/\s+[0-9a-f]{32}$/i, '').trim();

  function csvParse(text) {
    const rows = [];
    let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') {
          if (text[i + 1] === '"') { cur += '"'; i++; } else q = false;
        } else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n') { row.push(cur.replace(/\r$/, '')); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur.replace(/\r$/, '')); rows.push(row); }
    return rows.filter((r) => r.some((c) => c.trim() !== ''));
  }

  // 把 md 裡指向 zip 內檔案的圖片連結,上傳到 Drive 後改寫成雲端網址
  async function rewriteZipImages(md, baseDir, zip, stats) {
    const re = /!\[([^\]]*)\]\(([^)]+)\)/g;
    const MIMES = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml' };
    let out = '', last = 0, m;
    while ((m = re.exec(md))) {
      out += md.slice(last, m.index);
      last = re.lastIndex;
      const target = m[2].split(' ')[0];
      if (/^https?:/.test(target)) { out += m[0]; continue; }
      const rel = decodeURIComponent(target);
      const ext = (rel.split('.').pop() || '').toLowerCase();
      const mime = MIMES[ext];
      let entry = zip.files[baseDir + rel] || zip.files[rel];
      if (!entry) {
        const base = rel.split('/').pop();
        const hit = Object.keys(zip.files).find((k) => !zip.files[k].dir && (k === base || k.endsWith('/' + base)));
        if (hit) entry = zip.files[hit];
      }
      if (entry && mime && stats.uploaded < 30) {
        try {
          setStatus('上傳圖片 ' + (stats.uploaded + 1) + '…');
          const b64 = await entry.async('base64');
          const res = await run('api_uploadImage', rel.split('/').pop(), mime, b64);
          stats.uploaded++;
          out += '![' + m[1] + '](' + res.url + ')';
          continue;
        } catch (e) { /* 上傳失敗就降級成文字 */ }
      }
      out += m[1] || '';
    }
    return out + md.slice(last);
  }

  async function importZip(file) {
    if (typeof JSZip === 'undefined') throw new Error('JSZip 尚未載入,請重新整理後再試');
    setStatus('解壓縮中…');
    let zip = await JSZip.loadAsync(file);
    for (let hop = 0; hop < 3; hop++) {
      const names = Object.keys(zip.files).filter((p) => !zip.files[p].dir && !p.startsWith('__MACOSX'));
      if (names.some((p) => /\.(md|csv)$/i.test(p))) break;
      const inner = names.find((p) => p.toLowerCase().endsWith('.zip'));
      if (!inner) break;
      setStatus('解開內層壓縮…');
      zip = await JSZip.loadAsync(await zip.files[inner].async('arraybuffer'));
    }
    const paths = Object.keys(zip.files).filter((p) => !zip.files[p].dir && !p.startsWith('__MACOSX'));
    const mds = paths.filter((p) => p.toLowerCase().endsWith('.md'))
      .sort((a, b) => a.split('/').length - b.split('/').length || a.localeCompare(b));
    const csvs = paths.filter((p) => p.toLowerCase().endsWith('.csv') && !/_all\.csv$/i.test(p));
    if (!mds.length && !csvs.length) throw new Error('壓縮檔裡找不到 .md 或 .csv');
    const stats = { pages: 0, uploaded: 0 };
    const dirToPage = {};   // 「資料夾路徑」→ 對應頁 id(Notion 子頁面放在同名資料夾)
    const dirOwner = {};    // 「所在資料夾」→ 該層第一個 md 頁 id(同層 csv 掛它底下)
    let firstId = null;
    for (const p of mds) {
      const base = p.slice(0, -3);
      const dirName = p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
      const parentId = dirToPage[dirName] || '';
      let text = await zip.files[p].async('string');
      text = await rewriteZipImages(text, dirName ? dirName + '/' : '', zip, stats);
      text = text.replace(/\[([^\]]*)\]\((?!https?:)[^)]*\)/g, '$1');
      const blocks = mdToBlocks(text);
      let title = cleanNotionName(base.split('/').pop());
      if (blocks.length && blocks[0].type === 'header' && blocks[0].data.level === 1) {
        title = blocks[0].data.text.replace(/<[^>]+>/g, '') || title;
        blocks.shift();
      }
      setStatus('建立頁面「' + title + '」…');
      const pg = await run('api_createPage', parentId);
      await run('api_savePage', pg.id, title, JSON.stringify({ time: Date.now(), blocks: blocks }));
      pg.title = title;
      pages.set(pg.id, pg);
      dirToPage[base] = pg.id;
      if (!dirOwner[dirName]) dirOwner[dirName] = pg.id;
      if (parentId) expanded.add(parentId);
      if (!firstId) firstId = pg.id;
      stats.pages++;
    }
    for (const p of csvs) {
      const dirName = p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
      const parentId = dirToPage[dirName] || dirOwner[dirName] || '';
      const rows = csvParse(await zip.files[p].async('string'))
        .slice(0, 50)
        .map((r) => r.slice(0, 10).map((c) => escapeHtml(c)));
      if (!rows.length) continue;
      const title = cleanNotionName(p.split('/').pop().replace(/\.csv$/i, ''));
      setStatus('建立資料表「' + title + '」…');
      const pg = await run('api_createPage', parentId);
      await run('api_savePage', pg.id, title, JSON.stringify({
        time: Date.now(),
        blocks: [{ type: 'table', data: { withHeadings: true, content: rows } }]
      }));
      pg.title = title;
      pages.set(pg.id, pg);
      if (parentId) expanded.add(parentId);
      if (!firstId) firstId = pg.id;
      stats.pages++;
    }
    persistExpanded();
    renderTree();
    if (firstId) await openPage(firstId);
    setStatus('匯入完成:' + stats.pages + ' 頁、' + stats.uploaded + ' 張圖片');
  }

  // ---- 整站備份匯出 ----
  async function backupAll() {
    setStatus('備份中…');
    try {
      const res = await run('api_exportAll');
      const zip = new JSZip();
      const sanitize = (s) => (String(s || '未命名').replace(/[\\/:*?"<>|#%{}]/g, '_').trim() || '未命名').slice(0, 60);
      const walk = (pid, prefix) => {
        const kids = res.pages
          .filter((p) => p.parentId === pid)
          .sort((a, b) => a.order - b.order || a.title.localeCompare(b.title));
        const used = {};
        for (const p of kids) {
          let name = sanitize(p.title);
          if (used[name]) { used[name]++; name += '_' + used[name]; } else used[name] = 1;
          let md;
          try { md = toMarkdown(p.title || '未命名', JSON.parse(p.content || '{}')); } catch (e) { md = '# ' + p.title; }
          zip.file(prefix + name + '.md', md);
          walk(p.id, prefix + name + '/');
        }
      };
      walk('', '');
      zip.file('_backup.json', JSON.stringify(res.pages));
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '筆記備份-' + new Date().toISOString().slice(0, 10) + '.zip';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      setStatus('備份完成:' + res.pages.length + ' 頁');
    } catch (e) {
      setStatus('備份失敗:' + (e.message || e), 'err');
    }
  }

        const rest = document.createElement('button');
        rest.className = 'btn';
        rest.textContent = '還原';
        rest.onclick = async () => {
          setStatus('還原中…');
          try {
            await run('api_restorePage', it.id);
            await reloadIndex();
            setStatus('已還原「' + (it.title || '未命名') + '」');
            showTrash();
          } catch (e) { setStatus('還原失敗:' + (e.message || e), 'err'); }
        };
        row.appendChild(rest);
        item.append(t, s, row);
        tree.appendChild(item);
      }
      const clear = document.createElement('button');
      clear.className = 'backBtn';
      clear.textContent = '清空回收桶(永久刪除全部)';
      clear.onclick = async () => {
        if (!confirm('永久刪除回收桶內全部頁面?這個動作無法復原。')) return;
        setStatus('清空中…');
        try {
          const r = await run('api_emptyTrash');
          setStatus('已永久刪除 ' + r.purged + ' 頁');
          showTrash();
        } catch (e) { setStatus('清空失敗:' + (e.message || e), 'err'); }
      };
      tree.appendChild(clear);
    } catch (e) {
      tree.innerHTML = '<div class="hint">回收桶載入失敗:' + escapeHtml(e.message || e) + '</div>';
    }
  }

  $('mdFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setStatus('匯入中…');
    try {
      if (/\.zip$/i.test(file.name)) {
        await importZip(file);
        return;
      }
      const text = await file.text();
      const blocks = mdToBlocks(text);
      let title = cleanNotionName(file.name.replace(/\.(md|markdown|txt)$/i, ''));
      if (blocks.length && blocks[0].type === 'header' && blocks[0].data.level === 1) {
        title = blocks[0].data.text.replace(/<[^>]+>/g, '') || title;
        blocks.shift();
      }
      const p = await run('api_createPage', '');
      await run('api_savePage', p.id, title, JSON.stringify({ time: Date.now(), blocks: blocks }));
      p.title = title;
      pages.set(p.id, p);
      renderTree();
      await openPage(p.id);
      setStatus('已匯入「' + title + '」');
    } catch (err) {
      setStatus('匯入失敗:' + (err.message || err), 'err');
    }
  });

  function hideIntg() {
    $('intgPanel').classList.add('hidden');

  function intgGroup(card, titleText) {
    const g = document.createElement('div');
    g.className = 'intgGroup';
    const t = document.createElement('div');
    t.className = 'intgTitle';
    t.textContent = titleText;
    g.appendChild(t);

  function intgBtn(text, onclick) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = text;
    b.onclick = onclick;
    return b;
  }

  function intgNote(g) {
    const s = document.createElement('div');
    s.className = 'aiNote';
    g.appendChild(s);
    return s;
  }

  function insertBlocksAtEnd(list) {
    for (const b of list) {
      editor.blocks.insert(b.type, b.data, {}, editor.blocks.getBlocksCount(), false);
    }
    markDirty();
  }

  function currentTitle() {
    return $('titleInput').value.trim() || '未命名';

  // 對外動作的送出前確認:講清楚「送到哪裡、用哪個帳號、能不能收回」。
  // 只用在會離開這個應用程式的動作(寄信、Classroom 公告、建立 Drive 檔案、公開連結)。
  // 可逆的本機開關(每日自動頁、自動備份)刻意不加 —— 確認視窗一多,
  // 使用者就會養成反射性按下去的習慣,真正該停下來的時候反而擋不住。
  function confirmSend(what, target, recoverable) {
    return confirm(
      what + '\n\n'
      + '對象:' + target + '\n'
      + '身分:你目前登入的 Google 帳號\n'
      + (recoverable
        ? '可否還原:可以,事後仍能自行刪除'
        : '⚠ 送出後無法收回')
      + '\n\n確定要繼續嗎?'
    );
  }

  function hideShare() {
