  async function showShare() {
    if (!currentId || isTmp(currentId)) return;
    hideVersions();
    hideAi();
    hideIntg();
    const panel = $('sharePanel');
    panel.classList.remove('hidden');
    panel.innerHTML = '<div class="vcard">讀取分享狀態…</div>';
    const render = (status) => {
      const card = document.createElement('div');
      card.className = 'vcard';
      const head = document.createElement('div');
      head.className = 'vhead';
      const headText = document.createElement('span');
      headText.textContent = '公開分享此頁';
      const close = document.createElement('button');
      close.textContent = '✕';
      close.onclick = hideShare;
      head.append(headText, close);
      card.appendChild(head);
      if (!status.available) {
        const p = document.createElement('div');
        p.textContent = '分享功能尚未設定(缺少公開部署),見交接文件。';
        card.appendChild(p);
      } else if (status.shared) {
        const row = document.createElement('div');
        row.className = 'aiRow';
        const urlBox = document.createElement('input');
        urlBox.className = 'aiInput';
        urlBox.readOnly = true;
        urlBox.value = status.url;
        urlBox.onclick = () => urlBox.select();
        const copy = document.createElement('button');
        copy.className = 'btn';
        copy.textContent = '複製連結';
        copy.onclick = async () => {
          try { await navigator.clipboard.writeText(status.url); } catch (e) { urlBox.select(); document.execCommand('copy'); }
          setStatus('已複製分享連結');
        };
        const stop = document.createElement('button');
        stop.className = 'btn';
        stop.textContent = '取消分享';
        stop.onclick = async () => {
          if (!confirm('取消分享?現有連結會立刻失效。')) return;
          try {
            await run('api_unsharePage', currentId);
            setStatus('已取消分享');
            showShare();
          } catch (e) { setStatus('取消失敗:' + (e.message || e), 'err'); }
        };
        const scopeBtn = document.createElement('button');
        scopeBtn.className = 'btn';
        scopeBtn.textContent = status.scope === 'tree' ? '改為僅此頁' : '改為含子頁面';
        scopeBtn.onclick = async () => {
          try {
            await run('api_setShareScope', currentId, status.scope === 'tree' ? 'page' : 'tree');
            showShare();
          } catch (e) { setStatus('切換失敗:' + (e.message || e), 'err'); }
        };
        row.append(urlBox, copy, scopeBtn, stop);
        card.appendChild(row);
        const note = document.createElement('div');
        note.className = 'aiNote';
        note.textContent = (status.scope === 'tree'
          ? '目前範圍:此頁+全部子頁面,分享頁左側會有目錄。'
          : '目前範圍:僅此頁。')
          + '任何拿到連結的人都能閱讀(唯讀、不用登入),內容永遠是最新版,連結無法被猜到。';
        card.appendChild(note);
      } else {
        const row = document.createElement('div');
        row.className = 'aiRow';
        const mk = (label, scope) => {
          const b = document.createElement('button');
          b.className = 'btn';
          b.textContent = label;
          b.onclick = async () => {
            if (!confirmSend(
              '要建立公開連結嗎?任何拿到連結的人都能閱讀,不需要登入。'
                + (scope === 'tree' ? '\n範圍:「' + currentTitle() + '」及其全部子頁面。' : '\n範圍:僅「' + currentTitle() + '」這一頁。'),
              '網際網路(公開唯讀連結)', true)) return;
            b.textContent = '建立中…';
            try {
              await run('api_sharePage', currentId, scope);
              showShare();
            } catch (e) {
              b.textContent = label;
              setStatus('分享失敗:' + (e.message || e), 'err');
            }
          };
          return b;
        };
        row.append(mk('分享此頁', 'page'), mk('分享此頁+子頁面', 'tree'));
        card.appendChild(row);
        const note = document.createElement('div');
        note.className = 'aiNote';
        note.textContent = '會產生一個公開唯讀網頁,拿到連結的人不用登入就能看。「含子頁面」版左側會有目錄可切換頁面。可隨時取消或切換範圍。';
        card.appendChild(note);
      }
      panel.innerHTML = '';
      panel.appendChild(card);
    };
    try {
      render(await run('api_shareStatus', currentId));
    } catch (e) {
      panel.innerHTML = '<div class="vcard">讀取失敗:' + escapeHtml(e.message || e) + '</div>';
    }
  }

  // ---- 側欄開關(手機=抽屜,桌機=收合) ----
  function toggleNav() {
    if (window.innerWidth <= 768) document.documentElement.classList.toggle('nav-open');
    else document.documentElement.classList.toggle('side-hide');
  }

  // ---- [[頁面連結]]:在編輯區打「[[」跳出頁面選單,插入內部連結 ----
  const plink = { open: false, node: null, offset: 0, sel: 0, items: [] };
  const plinkEl = $('plinkPicker');
  const plinkInput = plinkEl.querySelector('input');
  const plinkList = $('plinkList');

  function plinkClose() {
    plink.open = false;
    plinkEl.classList.add('hidden');
  }

  function plinkUpdateSel() {
    Array.from(plinkList.children).forEach((el, i) => el.classList.toggle('sel', i === plink.sel));
  }

  function plinkRender() {
    const q = plinkInput.value.trim().toLowerCase();
    plink.items = Array.from(pages.values())
      .filter((p) => !p.pending && p.id !== currentId && p.kind !== 'folder' && (!q || (p.title || '未命名').toLowerCase().includes(q)))
      .sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')))
      .slice(0, 8);
    plink.sel = 0;
    plinkList.innerHTML = '';
    if (!plink.items.length) {
      const d = document.createElement('div');
      d.className = 'plinkItem';
      d.textContent = '找不到頁面';
      plinkList.appendChild(d);
      return;
    }
    plink.items.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'plinkItem' + (i === plink.sel ? ' sel' : '');
      d.textContent = p.title || '未命名';
      d.onmousedown = (e) => { e.preventDefault(); plinkPick(i); };
      plinkList.appendChild(d);
    });
  }

  function plinkPick(i) {
    const p = plink.items[i];
    if (!p) { plinkClose(); return; }
    const node = plink.node;
    try {
      node.deleteData(plink.offset - 2, 2);
      const range = document.createRange();
      range.setStart(node, plink.offset - 2);
      range.collapse(true);
      const a = document.createElement('a');
      a.href = '#page=' + p.id;
      a.textContent = p.title || '未命名';
      const space = document.createTextNode(' ');
      range.insertNode(space);
      range.insertNode(a);
      const sel = window.getSelection();
      sel.removeAllRanges();
      const after = document.createRange();
      after.setStartAfter(space);
      after.collapse(true);
      sel.addRange(after);
    } catch (e) { /* 文字節點已變動就放棄插入 */ }
    plinkClose();
    markDirty();
  }

  $('editor').addEventListener('input', () => {
    const sel = window.getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return;
    const node = sel.anchorNode;
    if (!node || node.nodeType !== 3) return;
    const off = sel.anchorOffset;
    if (off < 2 || node.textContent.slice(off - 2, off) !== '[[') return;
    if (node.parentElement && node.parentElement.closest('.tc-cell, .ce-code, .cdx-input')) return;
    const rect = sel.getRangeAt(0).getBoundingClientRect();
    plink.open = true;
    plink.node = node;
    plink.offset = off;
    plinkEl.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 280)) + 'px';
    plinkEl.style.top = Math.min(rect.bottom + 6, window.innerHeight - 320) + 'px';
    plinkEl.classList.remove('hidden');
    plinkInput.value = '';
    plinkRender();
    setTimeout(() => plinkInput.focus(), 0);
  });

  plinkInput.addEventListener('input', plinkRender);
  plinkInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); plinkClose(); }
    else if (e.key === 'Enter') { e.preventDefault(); plinkPick(plink.sel); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); plink.sel = Math.min(plink.sel + 1, plink.items.length - 1); plinkUpdateSel(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); plink.sel = Math.max(plink.sel - 1, 0); plinkUpdateSel(); }
  });

  document.addEventListener('mousedown', (e) => {
    if (plink.open && !plinkEl.contains(e.target)) plinkClose();
  });

  $('editor').addEventListener('click', (e) => {
    const a = e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    const href = a.getAttribute('href') || '';
    if (href.indexOf('#page=') === 0) {
      e.preventDefault();
      e.stopPropagation();
      const id = href.slice(6);
      if (pages.has(id)) openPage(id);
      else setStatus('連結目標不存在(可能已刪除或在回收桶)', 'err');
    } else if (/^https?:\/\//i.test(href)) {
      e.preventDefault();
      e.stopPropagation();
      window.open(href, '_blank', 'noopener');
    }
  });

  function cleanUrl(u) {
    try {
      const url = new URL(u);
      const drop = ['fbclid', 'gclid', 'msclkid', 'mc_cid', 'mc_eid', 'igshid', '_hsenc', '_hsmi', 'ref_src'];
      Array.from(url.searchParams.keys()).forEach((k) => {
        if (drop.indexOf(k.toLowerCase()) >= 0 || /^utm_/i.test(k)) url.searchParams.delete(k);
      });
      return url.toString();
    } catch (e) { return u; }
  }

  // 貼上單一網址 → 自動變成可點連結,並清掉常見追蹤參數(fbclid/utm_ 等)
  $('editor').addEventListener('paste', (e) => {
    const cd = e.clipboardData || window.clipboardData;
    if (!cd) return;
    const raw = (cd.getData('text') || '').trim();
    if (!/^https?:\/\/\S+$/i.test(raw) || /\s/.test(raw)) return;
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    const host = sel.anchorNode && (sel.anchorNode.nodeType === 3 ? sel.anchorNode.parentElement : sel.anchorNode);
    if (host && host.closest && host.closest('.ce-code, .tc-cell, .cdx-input, a')) return;
    e.preventDefault();
    e.stopPropagation();
    const clean = cleanUrl(raw);
    const a = document.createElement('a');
    a.href = clean;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = clean;
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(a);
    const after = document.createRange();
    after.setStartAfter(a);
    after.collapse(true);
    sel.removeAllRanges();
    sel.addRange(after);
    markDirty();
  }, true);

  $('titleInput').addEventListener('input', () => {
    const p = pages.get(currentId);
    if (p) p.title = $('titleInput').value.trim();
    const active = document.querySelector('.row.active .label');
    if (active) active.textContent = $('titleInput').value.trim() || '未命名';
    markDirty();
  });

  window.addEventListener('beforeunload', (e) => {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  (async function init() {
    try {
      const res = await run('api_init');
      hasGeminiKey = !!res.hasGeminiKey;
      if (res.geminiModel) geminiModel = res.geminiModel;
      customTemplates = res.templates || [];
      res.pages.forEach((p) => pages.set(p.id, p));
      renderTree();
      const last = localStorage.getItem('gnLastPage');
      const roots = childrenOf('').filter((p) => p.kind !== 'folder');
      const first = (pages.has(last) && pages.get(last).kind !== 'folder') ? last : (roots.length ? roots[0].id : null);
      if (first) await openPage(first); else showEmpty();
    } catch (e) {
      setStatus('初始化失敗:' + (e.message || e), 'err');
    }
  })();
</script>
</body>
